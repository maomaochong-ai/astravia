# golangci-lint config for packages/im-gateway.
#
# Mirrors the modest set of linters used by other Go packages in the repo
# (packages/api). Adjust here if upstream packages move first; we follow.

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: astravia-im-gateway
  misspell:
    locale: US

issues:
  exclude-dirs:
    - bin
    - tmp
  exclude-rules:
    # Test files often need wide-open expectations; let them ignore errcheck
    # for things like setup helpers.
    - path: _test\.go
      linters:
        - errcheck
